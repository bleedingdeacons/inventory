# Dependabot configuration.
#
# github-actions - every workflow here pins actions to a commit SHA. That is
# safe against a tag being silently repointed, but a pinned SHA also never
# picks up an upstream fix on its own: without this file the pins simply rot.
# Dependabot rewrites the SHA and its trailing version comment together, which
# is the only thing that keeps pinning honest.
#
# nuget - the two libraries, the test and spec projects and the example
# CLI. directory "/" so the updater walks all of them rather than naming each.
#
# Monthly and grouped on purpose: a weekly ungrouped schedule is a great deal
# of noise for a library this size.
#
# Note: release.yml fires on tag pushes, so merging a Dependabot PR to main
# publishes nothing by itself.

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Newly published versions are the ones most likely to be malicious or
    # broken, so hold them for a week before proposing them.
    cooldown:
      default-days: 7
    # One PR for all action bumps rather than one per action.
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    # Grouped: a month of package updates arrives as one PR that CI runs
    # against as a set, rather than one PR per package.
    groups:
      dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
